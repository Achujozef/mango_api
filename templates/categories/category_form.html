{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="mb-4">{% if form.instance.pk %}Edit{% else %}Add{% endif %} Category</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                <!-- Category Name -->
                <div class="col-md-6 mb-3">
                    <label for="id_name" class="form-label">Category Name</label>
                    <input type="text" class="form-control" id="id_name" name="name" value="{{ form.name.value|default_if_none:'' }}" required>
                </div>

                <!-- Slug -->
                <div class="col-md-6 mb-3">
                    <label for="id_slug" class="form-label">Slug</label>
                    <input type="text" class="form-control" id="id_slug" name="slug" value="{{ form.slug.value|default_if_none:'' }}" required>
                </div>

                <!-- Description -->
                <div class="col-md-12 mb-3">
                    <label for="id_description" class="form-label">Description</label>
                    <textarea class="form-control" id="id_description" name="description" rows="3">{{ form.description.value|default_if_none:'' }}</textarea>
                </div>

                <!-- Image Upload with Preview -->
                <div class="col-md-6 mb-3">
                    <label for="id_image" class="form-label">Image</label>
                    <input type="file" class="form-control" id="id_image" name="image" accept="image/*" onchange="previewImage(event)">
                    {% if form.instance.image %}
                        <img id="image_preview" src="{{ form.instance.image.url }}" class="img-thumbnail mt-2" width="150">
                    {% else %}
                        <img id="image_preview" class="img-thumbnail mt-2" width="150" style="display: none;">
                    {% endif %}
                </div>

                <!-- Is Active -->
                <div class="col-md-6 mb-3">
                    <label class="form-label d-block">Active</label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="id_is_active" name="is_active" {% if form.is_active.value %}checked{% endif %}>
                        <label class="form-check-label" for="id_is_active">Yes</label>
                    </div>
                </div>

                <!-- Meta Title -->
                <div class="col-md-6 mb-3">
                    <label for="id_meta_title" class="form-label">Meta Title</label>
                    <input type="text" class="form-control" id="id_meta_title" name="meta_title" value="{{ form.meta_title.value|default_if_none:'' }}">
                </div>

                <!-- Meta Description -->
                <div class="col-md-6 mb-3">
                    <label for="id_meta_description" class="form-label">Meta Description</label>
                    <textarea class="form-control" id="id_meta_description" name="meta_description" rows="2">{{ form.meta_description.value|default_if_none:'' }}</textarea>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<!-- JavaScript to Auto-Generate Slug and Preview Image -->
<script>
    document.getElementById("id_name").addEventListener("keyup", function() {
        let slug = this.value.toLowerCase().replace(/ /g, "-").replace(/[^\w-]+/g, "");
        document.getElementById("id_slug").value = slug;
    });

    function previewImage(event) {
        let reader = new FileReader();
        reader.onload = function() {
            let img = document.getElementById("image_preview");
            img.src = reader.result;
            img.style.display = "block";
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
{% endblock %}
